<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0e10">
  <title>Desk · Editor</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #0d0e10; --fg: #e8e8eb; --muted: #8d8f96; --faint: #4b4d53; --line: #1e1f23;
      --accent: #6fcf97; --hard: #e2727b; --med: #e2b155; --easy: #5cc4b2;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --mono: ui-monospace, "Roboto Mono", "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
      color-scheme: dark;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    main { max-width: 920px; margin: 0 auto; padding: 32px max(16px, env(safe-area-inset-left)) 64px; }
    h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
    .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
    h2 { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); margin: 32px 0 10px; }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px 16px; align-items: end; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.wide { grid-column: 1 / -1; }
    label { font-size: 13px; color: var(--muted); }
    input, select {
      font: inherit; font-size: 16px; color: var(--fg); background: #131417;
      border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-height: 44px; width: 100%;
    }
    input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button {
      font: inherit; font-size: 14px; color: var(--fg); background: none; cursor: pointer;
      border: 1px solid var(--line); border-radius: 8px; min-height: 44px; padding: 0 16px;
      transition: transform 140ms var(--ease-out), border-color 160ms ease;
    }
    button:active { transform: scale(0.97); }
    button.primary { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
    button.danger { color: var(--hard); }
    @media (hover: hover) and (pointer: fine) { button:hover { border-color: var(--faint); } }
    .msg { font-size: 13px; min-height: 20px; margin-top: 8px; color: var(--muted); }
    .msg.err { color: var(--hard); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; font-weight: 500; font-size: 12px; color: var(--faint); padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); }
    td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
    td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
    td select { min-height: 40px; padding: 6px 10px; }
    .muted { color: var(--muted); }
    .empty { color: var(--faint); padding: 14px 0; }
    .pinrow { display: flex; gap: 10px; align-items: end; max-width: 360px; }
    @media (max-width: 640px) {
      table, thead, tbody, tr, td { display: block; } thead { display: none; }
      tr { border-bottom: 1px solid var(--line); padding: 10px 0; }
      td { border: 0; padding: 4px 0; }
    }
  </style>
</head>
<body>
<main>
  <h1>Desk editor</h1>
  <p class="sub">Changes show up on the desk dashboard within a minute.</p>

  <section id="pinBox">
    <h2>Unlock</h2>
    <div class="pinrow">
      <div class="field" style="flex:1">
        <label for="pin">PIN (printed in Termux when the server starts)</label>
        <input id="pin" inputmode="numeric" autocomplete="off" maxlength="6">
      </div>
      <button class="primary" id="pinBtn">Unlock</button>
    </div>
    <p class="msg" id="pinMsg" role="status"></p>
  </section>

  <section id="editor" hidden>
    <h2>Add an exam, test or deadline</h2>
    <form id="addEvent">
      <div class="field"><label for="evKind">Type</label><select id="evKind" name="kind"></select></div>
      <div class="field"><label for="evTitle">What</label><input id="evTitle" name="title" required autocomplete="off" placeholder="OS mid-sem"></div>
      <div class="field"><label for="evDate">Date</label><input id="evDate" name="date" type="date" required></div>
      <div class="field"><label for="evTime">Time (optional)</label><input id="evTime" name="time" type="time"></div>
      <div class="field"><label for="evWhere">Where (optional)</label><input id="evWhere" name="where" autocomplete="off"></div>
      <div class="field"><button class="primary" type="submit">Add</button></div>
    </form>
    <p class="msg" id="evMsg" role="status"></p>
    <table>
      <thead><tr><th>Type</th><th>What</th><th>When</th><th>Where</th><th></th></tr></thead>
      <tbody id="evRows"></tbody>
    </table>

    <h2>Add an application</h2>
    <form id="add">
      <div class="field"><label for="company">Company</label><input id="company" name="company" required autocomplete="off"></div>
      <div class="field"><label for="role">Role</label><input id="role" name="role" value="SWE Intern" autocomplete="off"></div>
      <div class="field">
        <label for="stage">Stage</label>
        <select id="stage" name="stage"></select>
      </div>
      <div class="field"><label for="applied">Applied on</label><input id="applied" name="applied" type="date"></div>
      <div class="field"><label for="via">How</label><input id="via" name="via" placeholder="Referral, cold DM, careers page…" autocomplete="off"></div>
      <div class="field"><button class="primary" type="submit">Add</button></div>
    </form>
    <p class="msg" id="addMsg" role="status"></p>

    <h2>All applications</h2>
    <table>
      <thead><tr><th>Company</th><th>Role</th><th>How</th><th>Applied</th><th>Stage</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</main>
<script>
"use strict";
const STAGES = ["Applied", "OA", "Interview", "Offer", "Rejected", "Ghosted"];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmt = (iso) => iso ? `${iso.slice(8)} ${MONTHS[+iso.slice(5, 7) - 1]} ${iso.slice(0, 4)}` : "";

let pin = "";
try { pin = localStorage.getItem("deskPin") || ""; } catch {}

async function api(method, url, body) {
  const r = await fetch(url, {
    method,
    headers: { "Content-Type": "application/json", "X-Pin": pin },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `Request failed (${r.status})`);
  return data;
}

async function unlock() {
  try {
    await api("POST", "/api/pin-check");
    try { localStorage.setItem("deskPin", pin); } catch {}
    $("pinBox").hidden = true;
    $("editor").hidden = false;
    load();
  } catch (e) {
    $("pinMsg").textContent = pin ? e.message : "";
    $("pinMsg").className = "msg err";
  }
}

$("pinBtn").addEventListener("click", () => { pin = $("pin").value.trim(); unlock(); });
$("pin").addEventListener("keydown", (e) => { if (e.key === "Enter") $("pinBtn").click(); });

$("stage").innerHTML = STAGES.map((s) => `<option>${s}</option>`).join("");
$("applied").value = new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);

const KINDS = ["Exam", "Test", "Quiz", "Lab exam", "Viva", "Due", "OA", "Event"];
$("evKind").innerHTML = KINDS.map((k) => `<option>${k}</option>`).join("");

$("addEvent").addEventListener("submit", async (e) => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target));
  try {
    await api("POST", "/api/events", body);
    $("evMsg").textContent = `Added ${body.title}.`;
    $("evMsg").className = "msg";
    $("evTitle").value = ""; $("evTime").value = ""; $("evWhere").value = "";
    $("evTitle").focus();
    load();
  } catch (err) {
    $("evMsg").textContent = err.message;
    $("evMsg").className = "msg err";
  }
});

$("evRows").addEventListener("click", async (e) => {
  if (!e.target.matches("[data-del]")) return;
  const tr = e.target.closest("tr");
  if (!confirm(`Delete ${tr.cells[1].textContent}?`)) return;
  await api("DELETE", `/api/events/${tr.dataset.id}`);
  load();
});

async function load() {
  const { tracker, events } = await (await fetch("/api/state")).json();
  $("evRows").innerHTML = events.length ? events.map((ev) => `
    <tr data-id="${esc(ev.id)}">
      <td class="muted">${esc(ev.kind)}</td>
      <td>${esc(ev.title)}</td>
      <td class="num">${fmt(ev.date)}${ev.time ? " · " + esc(ev.time) : ""}</td>
      <td class="muted">${esc(ev.where)}</td>
      <td><button class="danger" data-del aria-label="Delete ${esc(ev.title)}">Delete</button></td>
    </tr>`).join("") : `<tr><td colspan="5" class="empty">No exams or tests added yet.</td></tr>`;
  $("rows").innerHTML = tracker.length ? tracker.map((a) => `
    <tr data-id="${esc(a.id)}">
      <td>${esc(a.company)}</td>
      <td class="muted">${esc(a.role)}</td>
      <td class="muted">${esc(a.via)}</td>
      <td class="num">${fmt(a.applied)}</td>
      <td><select aria-label="Stage for ${esc(a.company)}">${STAGES.map((s) =>
        `<option${s === a.stage ? " selected" : ""}>${s}</option>`).join("")}</select></td>
      <td><button class="danger" data-del aria-label="Delete ${esc(a.company)}">Delete</button></td>
    </tr>`).join("") : `<tr><td colspan="6" class="empty">Nothing yet. Add your first application above.</td></tr>`;
}

$("add").addEventListener("submit", async (e) => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target));
  try {
    await api("POST", "/api/tracker", body);
    $("addMsg").textContent = `Added ${body.company}.`;
    $("addMsg").className = "msg";
    $("company").value = ""; $("via").value = "";
    $("company").focus();
    load();
  } catch (err) {
    $("addMsg").textContent = err.message;
    $("addMsg").className = "msg err";
  }
});

$("rows").addEventListener("change", async (e) => {
  const tr = e.target.closest("tr");
  try { await api("PUT", `/api/tracker/${tr.dataset.id}`, { stage: e.target.value }); }
  catch (err) { alert(err.message); load(); }
});

$("rows").addEventListener("click", async (e) => {
  if (!e.target.matches("[data-del]")) return;
  const tr = e.target.closest("tr");
  if (!confirm(`Delete ${tr.cells[0].textContent}?`)) return;
  await api("DELETE", `/api/tracker/${tr.dataset.id}`);
  load();
});

unlock();
</script>
</body>
</html>
